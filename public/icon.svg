<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle luxury border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Stylized Gavel / Auction Mallet Icon -->
  <g transform="translate(256,230) rotate(-45)">
    <!-- Mallet Head -->
    <rect x="-80" y="-40" width="160" height="80" rx="16" fill="url(#goldGrad)"/>
    <!-- Head Inset accents -->
    <line x1="-50" y1="-40" x2="-50" y2="40" stroke="#713F12" stroke-width="6"/>
    <line x1="50" y1="-40" x2="50" y2="40" stroke="#713F12" stroke-width="6"/>
    <!-- Handle -->
    <rect x="-14" y="38" width="28" height="150" rx="12" fill="#E2E8F0"/>
    <rect x="-10" y="44" width="20" height="138" rx="8" fill="#F8FAFC"/>
    <rect x="-16" y="160" width="32" height="36" rx="8" fill="url(#goldGrad)"/>
  </g>

  <!-- Sound block / Sound base -->
  <g transform="translate(180, 360)">
    <rect x="0" y="0" width="152" height="28" rx="10" fill="url(#goldGrad)"/>
    <rect x="12" y="24" width="128" height="16" rx="6" fill="#A16207"/>
  </g>

  <!-- Realtime Live Flame / Pulse Star -->
  <circle cx="390" cy="120" r="16" fill="url(#redAccent)"/>
  <circle cx="390" cy="120" r="26" fill="none" stroke="#EF4444" stroke-width="3" stroke-opacity="0.5"/>
</svg>
